name: Seguir vivo
# GitHub apaga las tareas programadas de un repositorio sin actividad en 60 días: una vez al mes deja constancia.
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .vivo
          git config user.name "mi-sistema-bot"
          git config user.email "mi-sistema-bot@users.noreply.github.com"
          git add .vivo
          git commit -m "Sigo vivo"
          git push
